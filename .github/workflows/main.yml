name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      # 1. Клонируем репозиторий
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm install

      # 4. Генерируем JSON из CSV
      - name: Build data
        run: npm run build:data

      # 5. Собираем React-приложение
      - name: Build React app
        run: npm run build

      # Загрузка на FTP
      - name: Deploy via FTP
        uses: haukurh/lftp-action@v1
        with:
          ftp_host: ${{ vars.FTP_HOST }}
          ftp_user: ${{ vars.FTP_USER }}
          ftp_pass: ${{ secrets.FTP_PASS }}
          ftp_protocol: ftp
          ftp_port: 21
          force_ssl: false
          commands: |
            open -u ${{ vars.FTP_USER }},${{ secrets.FTP_PASS }} ftp://${{ vars.FTP_HOST }}
            set ftp:passive-mode true
            set ftp:ssl-allow no
            set cmd:fail-exit false
                      
            # Удаляем только старые React-файлы (игнорируем ошибки)
            rm -f static/js/main.*.js 2>/dev/null || true
            rm -f static/js/main.*.js.map 2>/dev/null || true
            rm -f static/js/main.*.js.LICENSE.txt 2>/dev/null || true
            rm -f static/css/main.*.css 2>/dev/null || true
            rm -f static/css/main.*.css.map 2>/dev/null || true
            rm -f asset-manifest.json 2>/dev/null || true
            rm -f index.html 2>/dev/null || true
            
            # Загружаем новую сборку
            mirror --continue --reverse --verbose build/ ./
            quit
